<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anytest Framework — dashboard</title>
<style>
  /* Two themes via [data-theme]; brand orange (#F2673A) shared. */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root[data-theme='dark'],:root:not([data-theme]){
    --c-ink:14 15 18; --c-slate:26 28 33; --c-panel:34 37 43; --c-line:44 47 54;
    --c-paper:245 246 248; --c-onbrand:255 255 255; --c-brand:242 103 58; --c-brand-600:217 82 31;
    --c-brand-300:248 145 111; --c-ok:48 164 108; --c-warn:247 104 8; --c-danger:229 72 77; --c-muted:138 144 153; }
  :root[data-theme='light']{
    --c-ink:255 255 255; --c-slate:246 247 249; --c-panel:236 238 241; --c-line:200 200 200;
    --c-paper:44 44 44; --c-onbrand:255 255 255; --c-brand:242 103 58; --c-brand-600:217 82 31;
    --c-brand-300:248 145 111; --c-ok:76 175 80; --c-warn:245 134 52; --c-danger:244 67 54; --c-muted:108 117 125; }
  :root{
    --bg:rgb(var(--c-ink)); --panel:rgb(var(--c-slate)); --raised:rgb(var(--c-panel));
    --line:rgb(var(--c-line)); --fg:rgb(var(--c-paper)); --mut:rgb(var(--c-muted));
    --acc:rgb(var(--c-brand)); --acc6:rgb(var(--c-brand-600)); --onbrand:rgb(var(--c-onbrand));
    --gap:rgb(var(--c-danger)); --pass:rgb(var(--c-ok)); --err:rgb(var(--c-warn));
    --man:rgb(var(--c-brand)); --na:rgb(var(--c-muted));
    --radius:6px; --shadow:0 1px 3px rgb(0 0 0 /.12),0 1px 2px rgb(0 0 0 /.08); }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
  /* shell: sidebar + scrolling main */
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:16px 12px}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px}
  .brand-t{font-weight:700;font-size:15px;line-height:1.05} .brand-s{font-weight:600;font-size:15px;color:var(--acc);line-height:1.05}
  #nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto}
  .brand,.side-foot{flex-shrink:0}
  #nav button{text-align:left;background:none;border:none;color:var(--mut);padding:8px 12px;border-radius:var(--radius);cursor:pointer;font:inherit;font-weight:500}
  #nav button:hover{background:var(--raised);color:var(--fg)}
  #nav button.on{background:rgb(var(--c-brand) / .15);color:var(--acc)}
  .nav-group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:12px 12px 3px;opacity:.7}
  .side-status{margin-top:auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:11px;font-size:12px}
  .side-foot #themebtn{width:100%}
  main{flex:1;overflow-y:auto;padding:22px 26px}
  h1{font-size:15px;margin:0;font-weight:600} .meta{color:var(--mut);font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
  .dot.ok{background:var(--pass)} .dot.danger{background:var(--gap)} .dot.muted{background:var(--na)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .badge.ok{background:rgb(var(--c-ok) / .15);color:var(--pass)}
  .badge.danger{background:rgb(var(--c-danger) / .15);color:var(--gap)}
  .badge.warn{background:rgb(var(--c-warn) / .15);color:var(--err)}
  .badge.brand{background:rgb(var(--c-brand) / .15);color:var(--acc)}
  .badge.muted{background:rgb(var(--c-muted) / .15);color:var(--na)}
  .sec-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 10px}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font:inherit;font-weight:500}
  .btn-ghost:hover{background:var(--raised)}
  table{border-collapse:collapse;width:100%} th,td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:var(--raised);color:var(--fg);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tbody tr:hover{background:var(--raised)}
  .cell{text-align:center;cursor:pointer;font-size:16px} .cell:hover{background:var(--raised)}
  .req{font-weight:600} .reqmeta{color:var(--mut);font-weight:400;font-size:12px}
  .b-gap{color:var(--gap)} .b-pass{color:var(--pass)} .b-error{color:var(--err)}
  .b-manual{color:var(--man)} .b-partial{color:var(--err)} .b-na{color:var(--na)} .b-notrun{color:var(--na)}
  .pill{display:inline-flex;align-items:center;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-weight:500}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:16px}
  .drill{position:fixed;top:0;right:0;width:min(640px,92vw);height:100vh;background:var(--panel);
         border-left:1px solid var(--line);padding:20px;overflow:auto;box-shadow:-8px 0 24px rgb(0 0 0 /.3);transform:translateX(100%);transition:.2s}
  .drill.open{transform:none} .drill .x{float:right;cursor:pointer;color:var(--mut);font-size:20px;border:none;background:none}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow:auto;font-size:12px;font-family:"JetBrains Mono",Consolas,Monaco,monospace}
  code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px;font-family:"JetBrains Mono",Consolas,monospace}
  a{color:var(--acc);cursor:pointer;text-decoration:none} a:hover{text-decoration:underline}
  .list a{display:block;padding:6px 8px;border-radius:var(--radius)} .list a:hover{background:var(--raised)}
  .v{font-weight:600} .v.gap{color:var(--gap)} .v.pass{color:var(--pass)} .v.error{color:var(--err)} .v.manual{color:var(--man)} .v.skipped{color:var(--na)}
  button.act{background:var(--acc);color:var(--onbrand);border:none;border-radius:var(--radius);padding:8px 18px;cursor:pointer;font:inherit;font-weight:500}
  button.act:hover{background:var(--acc6)}
  details{margin:8px 0} summary{cursor:pointer;color:var(--mut)}
  .md{line-height:1.62;font-size:13.5px}
  .md h1{font-size:18px;margin:.6em 0 .4em} .md h2{font-size:15px;margin:1.1em 0 .5em;border-bottom:1px solid var(--line);padding-bottom:5px} .md h3{font-size:13.5px;margin:.9em 0 .3em}
  .md p{margin:.55em 0} .md ul,.md ol{margin:.5em 0 .7em;padding-left:1.5em} .md li{margin:.28em 0}
  .md code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:.06em .38em;font-family:"JetBrains Mono",monospace;font-size:.9em}
  .md pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;overflow-x:auto;line-height:1.5} .md pre code{background:none;border:none;padding:0}
  .md strong{color:var(--fg);font-weight:650} .md hr{border:none;border-top:1px solid var(--line);margin:1.1em 0} .md>*:first-child{margin-top:0}
  td.md{white-space:normal;line-height:1.5;font-size:12.5px} td.md>*:first-child{margin-top:0} td.md>*:last-child{margin-bottom:0} td.md p{margin:.2em 0}
  .muted{color:var(--mut)}
  textarea.cfg{width:100%;min-height:320px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.55;margin-top:8px}
  textarea.code{tab-size:4;-moz-tab-size:4;white-space:pre}
  /* highlighted code editor: transparent textarea over a synced <pre> overlay */
  .code-wrap{position:relative;margin-top:0}
  .code-wrap pre.code-hl,.code-wrap textarea.code-ta{margin:0;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.55;tab-size:4;-moz-tab-size:4;
    white-space:pre;box-sizing:border-box;width:100%}
  .code-wrap pre.code-hl{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--fg);z-index:0;pointer-events:none}
  .code-wrap textarea.code-ta{position:relative;z-index:1;background:transparent;color:transparent;caret-color:var(--fg);
    overflow:auto;resize:vertical;display:block}
  .tk-com{color:#6a9955;font-style:italic} .tk-str{color:#c1843b} .tk-kw{color:#2f6fb3;font-weight:600}
  .tk-num{color:#8a5cd0} .tk-bi{color:#1a9b8a}
  .df-add{color:#3fb950} .df-del{color:#f85149} .df-hdr{color:#2f6fb3;font-weight:600} .df-meta{color:var(--mut)}
  .pill.origin-up{border-color:rgba(63,185,80,.55);color:#3fb950} .pill.origin-ag{border-color:rgba(47,111,179,.6);color:#2f6fb3}
  .f{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font:inherit}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .btn-danger{background:transparent;border:1px solid var(--gap);color:var(--gap);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font:inherit;font-weight:500}
  .btn-danger:hover{background:rgb(var(--c-danger) / .12)}
  /* forms + editors */
  .field{margin-bottom:13px}
  .field>label,.flabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:5px}
  .hlp{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:10px;font-weight:700;cursor:help;margin-left:6px;vertical-align:middle;text-transform:none}
  .hlp:hover{border-color:var(--acc);color:var(--acc)}
  .field input,.field select,.field textarea{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
  .editor-head{display:flex;align-items:center;gap:12px;margin:0 0 18px}
  .editor-head h2{margin:0;font-size:17px} .editor-head .spacer{margin-left:auto}
  .form-actions{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
  .itable{width:100%;border-collapse:separate;border-spacing:0 7px;margin-top:2px}
  .itable th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:0 7px 2px 2px;font-weight:600;position:static;background:none;border:none}
  .itable td{padding:0 7px 0 0;border:none;background:none;vertical-align:middle} .itable td input,.itable td select{width:100%}
  /* per-board driver/action wiring sub-sections */
  .wire-sec{border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-top:12px;background:var(--bg)}
  .wire-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:2px}
  .wire-card{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;margin:8px 0;background:var(--panel)}
  .wire-props{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .modal-bg{position:fixed;inset:0;background:rgb(0 0 0 /.55);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 70px rgb(0 0 0 /.45);width:min(680px,96vw);padding:24px;position:relative}
  .modal .x{position:absolute;right:14px;top:11px;cursor:pointer;color:var(--mut);font-size:20px;border:none;background:none}
  .modal h2{margin:0 0 15px;font-size:17px}
  main>.panel:first-child,main>*:first-child{margin-top:0}
  @media(max-width:760px){ .app{flex-direction:column;height:auto} .side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
    #nav{flex-direction:row;flex-wrap:wrap;flex:initial;overflow:visible;min-height:initial} .side-status{margin:0;flex:1 1 100%} .side-foot #themebtn{width:auto} }
</style>
</head>
<body>
<div class="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <div><div class="brand-t">Anytest</div><div class="brand-s">Framework</div></div>
    </div>
    <nav id="nav">
      <div class="nav-group">Test Plan</div>
      <button data-t="run">▶&nbsp; Run</button>
      <button data-t="tp-plans">🗂&nbsp; Test Plans</button>
      <button data-t="locks">🔒&nbsp; Locks</button>
      <div class="nav-group">View</div>
      <button data-t="reports" class="on">🗎&nbsp; Reports</button>
      <button data-t="docs">📖&nbsp; Documentation</button>
      <div class="nav-group">Studio</div>
      <button data-t="ad-agents">🖧&nbsp; Agents</button>
      <button data-t="st-wizard">✨&nbsp; AI Wizard</button>
      <button data-t="st-reqs">📑&nbsp; Requirements</button>
      <button data-t="st-checks">✓&nbsp; Tests</button>
      <button data-t="st-inventory">📇&nbsp; Inventory</button>
      <button data-t="st-benches">🖥&nbsp; Benches</button>
      <button data-t="st-suites">🗂&nbsp; Suites</button>
      <button data-t="ad-secrets">🔑&nbsp; Secrets</button>
      <div class="nav-group">Admin</div>
      <button data-t="ad-models">🧩&nbsp; Board models</button>
      <button data-t="ad-repos">📦&nbsp; Repositories</button>
      <button data-t="ad-users">👤&nbsp; Users</button>
      <button data-t="ad-backup">💾&nbsp; Backup</button>
    </nav>
    <div class="side-foot" style="flex-direction:column;align-items:stretch;gap:6px">
      <div id="side-user" class="muted" style="font-size:12px"></div>
      <div class="row" style="margin:0;gap:8px;align-items:center;flex-wrap:nowrap"><button class="btn-ghost" onclick="adminLogout()" style="flex:1" title="sign out">⎋ sign out</button><button id="themebtn" class="btn-ghost" style="flex:1;width:auto" title="toggle theme (dark / light)">◐ theme</button></div>
      <span id="fw-ver" class="muted" style="font-size:11px" title="framework version"></span></div>
  </aside>
  <main id="main">loading…</main>
</div>
<div class="drill" id="drill"><button class="x" onclick="closeDrill()">×</button><div id="drillbody"></div></div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="x" onclick="closeModal()">×</button><div id="modalbody"></div></div></div>

<script>
const $=(s,e=document)=>e.querySelector(s); const el=(t,p={})=>Object.assign(document.createElement(t),p);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SUM=null;
const VTONE={pass:"ok",gap:"danger",error:"warn",manual:"brand",skipped:"muted",na:"muted",partial:"warn",notrun:"muted"};
const badge=(v)=>`<span class="badge ${VTONE[v]||'muted'}">${esc(v||"")}</span>`;
const hlp=(text)=>`<span class="hlp" title="${esc(text)}">?</span>`;
let ADMIN_TOKEN=""; try{ ADMIN_TOKEN=sessionStorage.getItem("atf-admin")||""; }catch(e){}
function setAdminToken(t){ ADMIN_TOKEN=t||""; try{ t?sessionStorage.setItem("atf-admin",t):sessionStorage.removeItem("atf-admin"); }catch(e){} }
async function adminFetch(url,opts={}){ opts.headers=Object.assign({"Authorization":"Bearer "+ADMIN_TOKEN},opts.headers||{}); const r=await fetch(url,opts); if(r.status===401 && ADMIN_TOKEN){ setAdminToken(""); } return r; }
// Fetch the connected agents' overlay (checks + requirement catalogs). Distinguishes a stale/absent
// admin token (401) from "no agents" so views can prompt for sign-in instead of showing empty.
async function fetchAgentCatalog(){
  try{ const ac=await adminFetch("/api/agents/catalog");
    if(ac.status===401) return {agents:[],unauth:true};
    if(ac.ok) return {agents:(await ac.json()).agents||[],unauth:false};
  }catch(e){}
  return {agents:[],unauth:false};
}
function adminBanner(tab){ return `<div class="badge danger" style="display:block;padding:9px 11px;margin:8px 0"><b>Sign in as admin</b> to load agent-provided tests &amp; catalogs (no server repos are configured, so a connected agent is the only source). <a onclick="ensureAdmin().then(ok=>ok&&render('${tab}'))" style="margin-left:6px">Sign in ▸</a></div>`; }
let ADMIN_USER="", ADMIN_IS=false;
async function adminOk(){ if(!ADMIN_TOKEN) return false; try{ const r=await adminFetch("/api/admin/whoami"); if(!r.ok) return false; const d=await r.json(); ADMIN_USER=d.user||""; ADMIN_IS=!!d.is_admin; return ADMIN_IS; }catch(e){ return false; } }

function _authHdr(){ return ADMIN_TOKEN?{"Authorization":"Bearer "+ADMIN_TOKEN}:{}; }
async function j(u){const r=await fetch(u,{headers:_authHdr()}); if(r.status===401){ setAdminToken(""); showLogin(); throw new Error("401"); } return r.json();}
async function t(u){const r=await fetch(u,{headers:_authHdr()}); if(r.status===401){ setAdminToken(""); showLogin(); throw new Error("401"); } return r.text();}

// --- tiny markdown renderer (headings, bold/italic, code, fences, tables, hr, lists w/ wrapping,
//     merged paragraphs, raw HTML passthrough) ---
function md(src){
  const out=[]; const lines=src.split("\n"); let i=0;
  const inline=s=>esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g,"$1<em>$2</em>")   // *italic* (not ** and not "* ")
    .replace(/`([^`]+?)`/g,"<code>$1</code>");
  const marker=l=>/^\s*(\d+\.|[-*])\s+/.test(l);                    // a list-item start
  const cont=l=>/^\s+\S/.test(l)&&!marker(l);                       // an indented continuation line
  const isBlock=l=>l.startsWith("```")||/^<\/?(details|summary|code)/.test(l.trim())
    ||/^#{1,4}\s/.test(l)||/^---+\s*$/.test(l)||l.trim().startsWith("|")||marker(l)||l.trim()==="";
  const takeItems=(re)=>{ const items=[];                          // gather list items incl. wrapped lines
    while(i<lines.length&&re.test(lines[i])){ let t=lines[i++].replace(re,"");
      while(i<lines.length&&cont(lines[i])) t+=" "+lines[i++].trim(); items.push(t); } return items; };
  while(i<lines.length){
    const ln=lines[i];
    if(ln.startsWith("```")){ const buf=[]; i++; while(i<lines.length&&!lines[i].startsWith("```")){buf.push(lines[i++]);} i++; out.push("<pre>"+esc(buf.join("\n"))+"</pre>"); continue; }
    if(/^<\/?(details|summary|code)/.test(ln.trim())){ out.push(ln); i++; continue; }
    const h=ln.match(/^(#{1,4})\s+(.*)/); if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^---+\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }
    if(ln.trim().startsWith("|")){ const rows=[]; while(i<lines.length&&lines[i].trim().startsWith("|")){rows.push(lines[i++]);}
      const cells=r=>r.split("|").slice(1,-1).map(c=>c.trim());
      let html="<table>"; rows.forEach((r,ri)=>{ if(/^\s*\|[\s:|-]+\|\s*$/.test(r))return; const tag=ri===0?"th":"td";
        html+="<tr>"+cells(r).map(c=>`<${tag}>${inline(c)}</${tag}>`).join("")+"</tr>"; }); out.push(html+"</table>"); continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ out.push("<ol>"+takeItems(/^\s*\d+\.\s+/).map(x=>`<li>${inline(x)}</li>`).join("")+"</ol>"); continue; }
    if(/^\s*[-*]\s+/.test(ln)){ out.push("<ul>"+takeItems(/^\s*[-*]\s+/).map(x=>{ const cb=x.match(/^\[([ xX])\]\s+(.*)/);
      return cb?`<li style="list-style:none;margin-left:-18px"><input type="checkbox" ${/[xX]/.test(cb[1])?"checked":""}> ${inline(cb[2])}</li>`:`<li>${inline(x)}</li>`; }).join("")+"</ul>"); continue; }
    if(ln.trim()===""){ i++; continue; }
    const para=[ln]; i++;                                          // merge soft-wrapped lines into one paragraph
    while(i<lines.length&&!isBlock(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

function render(tab){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const m=$("#main"); m.innerHTML="";
  if(tab==="reports") return loginGate(m,renderReports);
  if(tab==="run") return renderRun(m);
  if(tab==="tp-plans") return renderTestPlans(m);
  if(tab==="locks") return renderLocks(m);
  if(tab==="st-benches") return renderBenches(m);
  if(tab==="st-suites") return renderSuites(m);
  if(tab==="st-reqs") return renderReqsEditor(m);
  if(tab==="st-checks") return renderChecks(m);
  if(tab==="st-inventory") return renderInventory(m);
  if(tab==="ad-secrets") return loginGate(m,renderSecretsAdmin);
  if(tab==="ad-models") return adminGate(m,renderModelsAdmin);
  if(tab==="ad-repos") return adminGate(m,renderReposAdmin);
  if(tab==="ad-agents") return loginGate(m,renderAgentsAdmin);
  if(tab==="st-wizard") return loginGate(m,renderWizardTab);

async function renderBackupAdmin(m){
  let h=`<div class="panel"><div class="sec-title" style="margin-top:0">Backup ${hlp("A snapshot of the WHOLE config store — benches, suites, inventory, users, board-models, repositories and requirements — as one SQLite file. Use it to move to a new server or keep a restore point.")}</div>`;

  h+=`<div class="form-actions" style="margin-top:4px"><button class="act" onclick="downloadBackup(this)">⬇ Download backup</button><span id="bk-msg" class="muted"></span></div>`;
  h+=`<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">`;
  h+=`<div class="sec-title" style="margin:0">Restore</div>`;
  h+=`<p class="muted" style="margin:6px 0">Replaces <b>everything</b> in this server's store with the uploaded snapshot. Disruptive — take a backup first.</p>`;
  h+=`<div class="row" style="gap:8px"><input type="file" id="bk-file" accept=".db,application/octet-stream" class="f" style="max-width:340px"><button class="btn-danger" onclick="restoreBackup(this)">Restore from file</button><span id="rs-msg" class="muted"></span></div>`;
  h+=`</div>`;

async function downloadBackup(btn){ const msg=$("#bk-msg"); if(msg) msg.textContent="preparing…"; btn.disabled=true;
  try{
    const r=await adminFetch("/api/admin/backup"); if(!r.ok){ if(msg) msg.textContent="error "+r.status; return; }
    const blob=await r.blob();
    const cd=r.headers.get("content-disposition")||""; const fn=(cd.match(/filename="?([^"]+)"?/)||[])[1]||"atf-store-backup.db";
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    if(msg) msg.textContent="downloaded "+fn;
  }finally{ btn.disabled=false; }
}
async function restoreBackup(btn){ const f=$("#bk-file").files[0], msg=$("#rs-msg");
  if(!f){ if(msg) msg.textContent="pick a backup file first"; return; }
  if(!confirm("Restore will OVERWRITE every bench, suite, secret and user on this server with the uploaded snapshot. Continue?"))return;
  btn.disabled=true; if(msg) msg.textContent="restoring…";
  try{
    const r=await adminFetch("/api/admin/restore",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:f});

async function wizSend(){
  const inp=$("#wiz-in"); const p=(inp?inp.value:"").trim(); if(!p||WIZ.busy)return;
  WIZ.msgs.push({role:"user",text:p}); WIZ.busy=true; WIZ.cancel=false; renderWizard();
  const say=t=>WIZ.msgs.push({role:"assistant",text:t});
  try{
    // Dispatch (quick) → returns a job; then POLL for the result. The dispatch is short so it
    // never hits the idle-connection drop that a minutes-long request did.
    const r=await adminFetch("/api/agents/"+encodeURIComponent(WIZ.aid)+"/ai-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p,session:WIZ.session})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.job){ say("⚠ "+(j.detail||("HTTP "+r.status))+" — check the agent is connected."); }
    else{
      const job=j.job, t0=Date.now(); let d=null;
      while(true){
        if(WIZ.cancel){ say("⏹ stopped. (claude may still be finishing in the background)"); break; }
        if(Date.now()-t0>360000){ say("⚠ timed out (>6 min). Try a faster model or reconnect the agent."); break; }
        await new Promise(res=>setTimeout(res,1800));
        let pr; try{ pr=await adminFetch("/api/agents/"+encodeURIComponent(WIZ.aid)+"/ai-run/"+job); }
        catch(e){ continue; }   // a dropped poll is transient — keep polling
        if(pr.status===404){ say("⚠ the run was lost (agent reconnected?). Try again."); break; }
        const pj=await pr.json().catch(()=>({}));
        if(pj.pending) continue;
        d=pj.result||{};
        if(d.ok===false && !d.out){ say("⚠ "+(d.error||d.err||"claude error")); }
        else{ WIZ.msgs.push({role:"assistant",text:d.out||d.error||d.err||"*(no output)*",meta:d.meta}); if(d.session) WIZ.session=d.session; }
        break;
      }
    }
  }catch(e){ say("⚠ request failed: "+((e&&e.message)||e)+" — check the agent is connected."); }
  finally{ WIZ.busy=false; renderWizard(); }
}

function diffHtml(t){
  if(!t) return '<span class="muted">no tracked changes vs HEAD</span>';
  return t.split("\n").map(l=>{
    const c = (l.startsWith("+")&&!l.startsWith("+++"))?"df-add"
      : (l.startsWith("-")&&!l.startsWith("---"))?"df-del"
      : l.startsWith("@@")?"df-hdr"
      : (l.startsWith("diff ")||l.startsWith("index ")||l.startsWith("+++")||l.startsWith("---"))?"df-meta":"";
    return `<span class="${c}">${esc(l)}</span>`;
  }).join("\n");
}

// VIEW (read-only): visualize the catalog; export downloads (Content-Disposition).
// One catalog instance PER ORIGIN (server upstream/cached + one per agent) — the same framework
// name can exist under several origins and differ, so they are separate rows prefixed by origin.
// one row per (catalog × who-inserted-it): app (loaded from a server repo), user (created in the
// app), or agent:<name> (pushed by a connected tester). Same catalog can appear under several.
async function catalogInstances(fws,agents){
  const rows=fws.map(f=>({framework:f.framework,count:f.count,
    origin:f.synced?"app":"user", source:f.synced?((f.sources||[])[0]||"—"):"—", server:true}));
  if(agents==null){ agents=(await fetchAgentCatalog()).agents; }
  agents.forEach(a=>{ const byFw={},srcBy={}; (a.requirements||[]).forEach(r=>{(byFw[r.framework]=byFw[r.framework]||new Set()).add(r.id); if(r.source)srcBy[r.framework]=r.source;});
    Object.entries(byFw).forEach(([fw,ids])=>rows.push({framework:fw,count:ids.size,origin:"agent",agent:a.name,source:srcBy[fw]||"—",server:false})); });
  return rows;
}
function insertedByCell(r){
  if(r.origin==="agent") return `<span class="pill origin-ag">agent: ${esc(r.agent)}</span>`;
  if(r.origin==="app") return `<span class="pill origin-up">app</span>`;
  return `<span class="pill">user</span>`;               // created in the app (no per-user identity yet)
}
// per-ARTIFACT delta: this specific test file has uncommitted changes (from the agent's git status)
// delta = the file on the agent changed since the app loaded it (connect/Sync); app tests = synced
function chkDeltaBadge(c){
  if(!(c.origin||"").startsWith("agent:")) return `<span class="badge ok" title="loaded from a server repo — it is the app">up-to-date</span>`;
  return c.delta ? `<span class="badge danger" title="the file on the agent changed since the app loaded it — Sync to reload">stale</span>`
                 : `<span class="badge ok" title="the app's copy matches the agent's filesystem">up-to-date</span>`;
}
function chkAnyDelta(c){ return (c.origin||"").startsWith("agent:") && !!c.delta; }

async function editRequirement(fw,code){

  h+=`<div class="grid2"><div class="field"><label>Code</label><input class="f" id="rq-code" value="${esc(r.code)}" ${code?'disabled':''} placeholder="G.2"></div>`
    +`<div class="field"><label>Priority</label><input class="f" id="rq-prio" value="${esc(r.priority)}" placeholder="0"></div></div>`;
  h+=`<div class="field"><label>Title</label><input class="f" id="rq-title" value="${esc(r.title)}" placeholder="Minimal services & ports"></div>`;
  h+=`<div class="field"><label>Description · Markdown ${hlp("Markdown — headings, lists, checklists, tables, `code`, **bold**. Rendered in the catalog and preview below.")}</label><textarea class="cfg" style="min-height:80px;margin-top:0" id="rq-desc" oninput="reqPreview()">${esc(r.description)}</textarea><div id="rq-desc-prev" class="md" style="border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-top:6px;max-height:180px;overflow:auto"></div></div>`;

async function saveRequirement(fw){
  const code=($("#rq-code").value||"").trim(); if(!code){$("#cfg-msg").textContent="code required";return;}
  const body={framework:fw,code,title:$("#rq-title").value,description:$("#rq-desc").value,verify:$("#rq-verify").value,priority:($("#rq-prio").value||"").trim()||null};
  const r=await adminFetch("/api/requirements",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.ok){ closeModal(); render('st-reqs'); } else $("#cfg-msg").textContent="error";
}

async function renderChecks(m){

  const _ov=await fetchAgentCatalog();
  const agentChecks=_ov.agents.flatMap(a=>(a.checks||[]).map(c=>({...c,_aid:a.id})));
  if(_ov.unauth) h+=adminBanner("st-checks");
  // per-artifact delta comes from the catalog: c.delta = the file on the agent changed since the app
  // last loaded it (connect / Sync). App tests have no delta (they ARE the app).
  const codeChecks=[...meta.checks.map(c=>({...c,origin:c.origin||"upstream"})), ...agentChecks];
  const srcOfChk=c=>(c.origin||"").startsWith("agent")?c.origin:(c.source_kind||"local");   // agent | git | local

  let agentList=[]; try{ const ra=await adminFetch("/api/agents"); if(ra.ok) agentList=(await ra.json())||[]; }catch(e){}  // sources w/ head+dirty (same as the Agents view)

  const grp={}; codeChecks.forEach(c=>{ const k=srcOfChk(c)+"\t"+(c.source||"—"); (grp[k]=grp[k]||[]).push(c); });
  const gkeys=Object.keys(grp).sort((a,b)=>{ const oa=a.split("\t")[0], ob=b.split("\t")[0]; return (oa.startsWith("agent")?1:0)-(ob.startsWith("agent")?1:0) || a.localeCompare(b); });
  gkeys.forEach(k=>{ const origin=k.split("\t")[0], repo=k.split("\t")[1]; const c0=grp[k][0];

      :c0.source_kind==="path"?`<span class="pill origin-up">path:${esc(c0.git||repo)}</span>`
      :`<span class="pill origin-up">app</span>`;
    let sep;                                                               // revision + dirty state (matches Agents)
    if(origin.startsWith("agent")){
      const agent=agentList.find(a=>a.id===c0._aid);
      const src=((agent&&agent.sources)||[]).find(s=>s.name===repo);

      sep=head+((src&&src.dirty)?`<span class="badge danger" title="the agent's working tree has uncommitted changes vs this commit">uncommitted</span>`:`<span class="badge ok" title="matches the commit (no uncommitted changes)">synced</span>`);
    } else {

      const commit=(sm&&sm.commit)?`<code class="muted" style="font-size:11px">${esc(sm.commit)}</code> `:'';

    h+=`<details style="margin-top:8px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden">`

  m.innerHTML=h;

// A manual test is a Markdown artifact (frontmatter + body) in the agent's repo — edit the raw

async function editAgentCheckMd(aid,cid){
  if(!await ensureAdmin()) return;
  const r=await adminFetch("/api/agents/"+encodeURIComponent(aid)+"/checks/"+encodeURIComponent(cid)+"/source");
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ openModal(`<h2>Can't open ${esc(cid)}</h2><p class="muted">${esc(d.detail||("HTTP "+r.status))}</p>`); return; }
  const body=`<div class="panel"><div class="sec-title">Manual test · Markdown ${hlp("The artifact IS the Markdown: a `---` frontmatter (id, title, severity, requirements — advisory, disruptive) + the steps the operator runs. Save writes the .md back to the agent's repo; the operator sees it rendered at run time.")}</div>`

    creds:Object.entries(b.creds||{}).map(([role,c])=>({role,user:c.user||"",ref:c.password_ref||""})),
    drivers:Object.entries(b.drivers||{}).map(([alias,c])=>{ const vals={};
      Object.entries(c).forEach(([k,v])=>{ if(k==='type'||k==='driver_name')return;
        if(k==='serial'&&v){ if(v.dev)vals.device=v.dev; if(v.baud)vals.baud=v.baud; } else vals[k]=v; });
      return {alias,driver_name:c.driver_name||c.type||"ip",vals}; }),
    actions:Object.entries(b.actions||{}).map(([an,a])=>({name:an,action_name:a.action_name||an,agent:a.agent||"",signals:Object.entries(a.signals||{}).map(([k,v])=>({k,v}))}))}))

function cfgToApi(){
  const agents={}; CFG.agents.forEach(a=>{ if(a.name) agents[a.name]={platform:a.platform,host:a.host,ssh:{user:a.user,password_ref:a.ref}};});
  const boards=CFG.boards.map(b=>{ const o={name:b.name,model:b.model,serial:b.serial,creds:{},drivers:{}};
    b.creds.forEach(c=>{ if(c.role) o.creds[c.role]={user:c.user,password_ref:c.ref};});
    (b.drivers||[]).forEach(d=>{ if(!d.alias)return;
      const cfg={driver_name:d.driver_name||""};
      Object.entries(d.vals||{}).forEach(([k,v])=>{ if(v!=="") cfg[k]=v; });
      o.drivers[d.alias]=cfg; });
    const actions={}; (b.actions||[]).forEach(a=>{ if(a.name){ const sigs={}; a.signals.forEach(s=>{if(s.k)sigs[s.k]=s.v;}); actions[a.name]={action_name:a.action_name||a.name,agent:a.agent,signals:sigs}; }});

  const meta=id=>{ const r=byId[id]||{}; const p=id.split(":"); return {framework:r.framework||p[0]||"", code:r.code||p.slice(1).join(":")||id, title:r.title||"", repo:r.source||""}; };
  if(!Array.isArray(sel.requirements)) return [];
  return sel.requirements.filter(rq=>rq&&typeof rq==="object").map(rq=>({ id:rq.id, ...meta(rq.id),
    repo:rq.repo||meta(rq.id).repo, sha1:rq.sha1||"", fallback:rq.fallback||"TEST_FAIL",
    tests:(rq.tests||[]).map(t=>({id:t.id,repo:t.repo||"",sha1:t.sha1||""})) }));
}

function suiteToggleTest(reqId,testId){ const rq=_suiteReq(reqId); if(!rq)return;

function suiteReqFallback(reqId){ const rq=_suiteReq(reqId); if(rq){ rq.fallback=rq.fallback==="TEST_PASS"?"TEST_FAIL":"TEST_PASS"; renderMapTable(); } }
function suiteRemoveReq(reqId){ SMAP.requirements=SMAP.requirements.filter(r=>r.id!==reqId); renderMapTable(); }
function _swap(arr,i,dir){ const j=i+dir; if(i<0||j<0||j>=arr.length)return false; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; return true; }

function suiteMoveTest(reqId,testId,dir){ const rq=_suiteReq(reqId); if(!rq)return; const i=rq.tests.findIndex(t=>t.id===testId); if(_swap(rq.tests,i,dir)) renderMapTable(); }

// ---- minimal dependency-free Python syntax highlighter (overlay) ----
const PY_KW=new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const PY_BI=new Set("print len range int str float bool list dict set tuple bytes type isinstance enumerate zip map filter sorted sum min max abs any all open Exception self cls super repr".split(" "));
function pyHighlight(src){
  const re=/(#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?""")|(r?f?'(?:\\.|[^'\\\n])*'|r?f?"(?:\\.|[^"\\\n])*")|(@[A-Za-z_][\w.]*)|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)/g;
  let out="",last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]||m[3]) out+=`<span class="tk-str">${esc(m[2]||m[3])}</span>`;
    else if(m[4]) out+=`<span class="tk-bi">${esc(m[4])}</span>`;
    else if(m[5]) out+=`<span class="tk-num">${esc(m[5])}</span>`;
    else{ const w=m[6]; out+= PY_KW.has(w)?`<span class="tk-kw">${esc(w)}</span>`:(PY_BI.has(w)?`<span class="tk-bi">${esc(w)}</span>`:esc(w)); }
    last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
function codeBox(id,value,minh){

function yamlHighlight(t){
  return (t||"").split("\n").map(l=>{
    if(/^\s*#/.test(l)) return `<span class="tk-com">${esc(l)}</span>`;
    const m=l.match(/^(\s*)(-\s+)?([^:#\s][^:#]*?)(:)(\s?)(.*)$/);
    if(m){ const ind=m[1],dash=m[2],key=m[3],colon=m[4],sp=m[5],rest=m[6];
      const rc=rest.indexOf(" #"); let val=esc(rest),com="";
      if(rc>=0){ val=esc(rest.slice(0,rc)); com=`<span class="tk-com">${esc(rest.slice(rc))}</span>`; }

const _DOC_PRINCIPLES=`## Architectural principles

The framework verifies a **network element as a black box** — as an attacker or auditor would, from
the outside — and keeps the concerns of *what to check*, *how to reach the board*, and *where to run*
cleanly separated.

### Black-box verification

A test **probes from the outside** (scan, TLS, reachability, a serial console, physical inspection) or
captures operator evidence. It must **not run commands on the board to *measure* it** — root/SSH is a
dev-only crutch that will be removed, so a test that depends on it does not hold.

The one **sanctioned** board interaction is the **adversarial attempt** — "try to get root / bypass
auth; **success ⇒ gap**, **rejected ⇒ pass**" (e.g. the GRUB \`init=/bin/sh\` bypass). It is
self-correcting: a hardened board makes the same test pass.

### The SDK contract — drivers & actions

A test **declares only the framework capabilities it needs** — nothing about *where* it runs. The
\`ctx\` object is the SDK that hands them over:

| Kind | What | In \`ctx\` |
|---|---|---|
| **drivers** (comm channels) | \`console\`, \`craft\`, \`mgmt\` (+ implicit \`host\`) | \`ctx.mgmt\`, \`ctx.console\`, \`ctx.craft\`, \`ctx.host\` |
| **actions** (node actions, system-defined) | e.g. \`power-cycle\` | \`ctx.actions.power_cycle("off"|"on"|"status")\` |

\`\`\`python
@register(id="mgmt-tls-legacy", drivers=("mgmt",), actions=(), severity=Severity.HIGH,
          title="Legacy TLS exposed")
def mgmt_tls_legacy(ctx):
    # black-box, from the mgmt vantage — never a command on the board
    ...
    return Result(Verdict.GAP, title="…", detail="…", evidence=ctx.write_evidence("…"))
\`\`\`

The **bench** provides the drivers/actions (which agent, which command per signal); the runner
**skips** a test whose declared driver/action the bench lacks — with a precise reason — instead of
failing it. **Capabilities belong to the bench, not the test.**

### The Suite is the requirement↔test map

Tests are **decoupled from requirements**. A **Suite** is the map: it links requirements to tests
(many-to-many), and:
- it is **ordered** — run order = the order you see, so a *setup* test goes first and a *teardown*
  last;
- it carries **provenance** (a content \`sha\` per referenced requirement/test) so it is reproducible
  and can be validated (ids still loaded? drifted?);
- a requirement's verdict is a **binary roll-up** — it passes if and only if *every* mapped test passed on that
  board.

A **Test Plan** = a Suite + a bench/board (what + where), and is what you actually run.

### Tests are files

Discovered from **check-source repos**, versioned in git:

\`\`\`
atf_checks/
  common/<driver>/<id>.py     # any board
  <model>/<driver>/<id>.py    # automated, only that model (e.g. router-x)
  <model>/manual/<id>.md      # manual — a Markdown artifact (operator steps + verdict)
\`\`\`

\`common\` runs on any board; a \`<model>\` slug runs only on boards of that model. Config lives in a
**SQLite store** (benches, suites, requirements, encrypted secrets); **reports are per-user**
(private/public, exportable).

### How a run flows

1. **Resolve** the Suite map → the ordered list of tests (or ad-hoc ids).
2. **Per board**: gate by **model** (common + this model only), then by **capability** — a test whose
   driver/action the bench doesn't provide is **SKIPPED** (unavailable), not dropped.
3. **Execute in the suite's order** (consecutive \`mgmt\` checks batch to the atf-mgmt container;
   host/console/craft run in-process), each against its \`ctx\`.
4. Collect **records** (verdict, drivers/actions, evidence) → roll up to the **requirement × board**
   compliance matrix in the report.`;
const _DOC_AGENT=`## The agent

The **dev/host agent** (Mode A) runs on **your** machine and connects **outbound** to the server.
**Stdlib-only** (\`python3 atf-agent.py …\`), it installs anywhere — only \`python3\` + \`git\` are needed.

- It registers your **local check-source repos** (\`--source\`) and provides their **catalog** (tests +
  requirements) as an **overlay** — including **uncommitted** edits.
- **Runs route to the agent**: an isolated \`atf _agent-worker\` subprocess executes against your
  working trees, so you test the code you're actually editing.
- **Authoring**: scaffolding writes new \`.py\`/\`.md\` files to your repo; the workbench edits source in place.

### How it connects (transport)

The agent speaks **plain HTTP** to the server using only the Python standard library (\`urllib\`) — no
framework, no SDK. The pattern is **outbound long-polling**:

1. It **registers** (\`POST /api/agents/register\`) with its enrollment token and gets a **session id**.
2. It **long-polls** \`GET /api/agents/{id}/poll\`, which blocks up to ~25 s until the server has a
   command for it (else returns a \`noop\` and it polls again). So **the server never connects *to* the
   agent** — the agent always initiates.
3. On a command it does the work and **POSTs the result back** (\`/catalog\`, \`/file\`, \`/inspect\`,
   \`/tree\`, …).

Because every connection is **outbound**, the agent works behind NAT / a firewall with **no inbound
port** to open. What crosses the wire: commands + results as **JSON**, requirement files as raw YAML
text, the **working tree** as a \`tar.gz\`, file read/write as JSON, and the **AI resource pack** as a
base64 \`tar.gz\`. In production the server should be reached over **HTTPS/TLS** (the token is a bearer
secret, and trees/results are your source).

### The enrollment token

Each user has a **private enrollment token** (Studio › Agents → *Your enrollment token*). An agent
that registers with it is **owned by that user**, and only the owner (or an admin) can browse it, run
against it, scaffold, or connect AI. Properties:

- **Private** — it is never shown to other users; treat it like a password.
- **Ownership** — it binds every agent it registers to you; it is *not* a login (the web UI still needs
  your user/password session).
- **Rotatable** — *rotate* issues a new token; **already-connected agents keep working**, but new
  connections need the new token. Rotate if it leaks.

### Security

- **Outbound-only** — no inbound port, so no listening service to attack on your machine.
- **Owner-gated** — agent management + AI + runs require your logged-in session *and* your ownership;
  the public API enforces per-user (and admin) permissions.
- **Sandboxed file access** — the server can only read/write files **under a source's \`atf_checks/\`
  tree**, and only \`.py\` / \`.md\` — it cannot touch the rest of your disk.
- **Runs and AI are local** — checks and Claude Code execute **on your machine against your repos**,
  never on the server; the black-box rule keeps checks off the target board's shell.
- Keep the token secret and use **TLS** to the server; disconnecting an agent clears its overlay.`;
const _DOC_AI=`## AI support (Claude Code)

The framework embeds **AI assistance for authoring and running tests** — powered by **Claude Code**
(Anthropic's coding agent). It is an *aid for using atf*, not for developing the framework itself.
Everything runs **locally on the developer's machine** (via their agent), never on the server.

**Turning it on.** Studio › Agents → **Connect AI** on one of your agents: the agent downloads a
**resource pack** to a path you choose and (optionally) picks the model + permission mode. Then chat
with the **AI Wizard** (Studio › AI Wizard).

### The resource pack

A small bundle the agent installs into your environment:

| File | Purpose |
|---|---|
| \`CLAUDE.md\` | The authoring guide Claude auto-loads: the SDK contract (drivers/actions), the black-box rule, the file layout, the scaffold/run flow. |
| \`.claude/skills/*\` | **Skills** — packaged procedures Claude invokes when relevant. |
| \`atf_mcp.py\` + \`.mcp.json\` | The **MCP server** + its launch config — typed tools that reach the atf API. |
| \`.claude/settings.json\` | Pre-approves the atf MCP tools + file edits (interactive use). |
| \`.atf-ai.env\` | \`ATF_SERVER\`, \`ATF_TOKEN\`, \`ATF_AID\`, \`ATF_SOURCES\` — the server URL/token, this agent's id, and **your local repo paths (where the test files live and Claude edits them)**. |

### Skills

A **skill** is a named, self-contained instruction set (a \`SKILL.md\` with a description) that Claude
Code **auto-invokes when the task matches** — so the model follows a vetted procedure instead of
improvising. The pack ships three:
- **\`atf-author-driver-test\`** — scaffold + implement an automated \`.py\` test (black-box, declares
  drivers/actions).
- **\`atf-author-manual-test\`** — author a manual \`.md\` artifact (operator steps + verdict).
- **\`atf-run\`** — run a suite / ad-hoc ids and interpret the report (verdicts, skip reasons, roll-up).

### MCP — Model Context Protocol

**MCP** is an open protocol that lets an AI client (here, Claude Code) talk to external systems
through **typed tools** over JSON-RPC — discoverable, structured, and safer than parsing shell output.

atf ships a small **local stdio MCP server** (\`atf_mcp.py\`, stdlib-only) that **proxies the atf REST
API** using the token in \`.atf-ai.env\`. Claude Code launches it automatically via \`.mcp.json\`. The
tools:

| Tool | Does |
|---|---|
| \`atf_catalog\` | List every known test (id, drivers, actions, mode, model). |
| \`atf_suites\` | List saved suites (the requirement→test maps). |
| \`atf_scaffold\` | Create a test file on your repo (\`kind: auto\`→\`.py\`, \`manual\`→\`.md\`). |
| \`atf_run\` | Run a suite or ad-hoc ids against a bench/board. |
| \`atf_report\` | Fetch a run's report — records + requirement×board roll-up. |

Authoring/editing the actual files is done **directly in the repos** under \`ATF_SOURCES\` (Claude edits
them); the MCP tools cover catalog/scaffold/run/report.

### Claude Code concepts used

- **Headless / print mode** (\`claude -p …\`) — a single non-interactive call; \`--output-format json\`
  returns structured output (result + session id). This is how the server drives Claude unattended.
- **Session continuity** — each reply carries a **\`session_id\`**; the next prompt uses \`--resume <id>\`,
  so the **Wizard remembers the whole conversation** across turns.
- **Permission modes** (the *unrestricted* toggle) — **unrestricted** = \`--dangerously-skip-permissions\`
  (no prompts, full access incl. shell); **restricted** = \`--permission-mode acceptEdits\` +
  \`--allowedTools\` limited to the atf MCP tools + file edits (**no shell**).
- **Model selection** — \`--model\` (\`opus\`/\`sonnet\`/\`haiku\`, or a full id); empty = your Claude Code
  default. Set at Connect AI or changed live in the Wizard footer.
- **Project context files** Claude Code reads from the working directory: \`CLAUDE.md\` (guidance),
  \`.mcp.json\` (MCP servers), \`.claude/settings.json\` (tool permissions + enabled servers).

### The AI Wizard

The **AI Wizard** (Studio > AI Wizard) is a **chat wrapper over headless Claude Code** — the same
resource pack, driven from the web UI instead of your terminal. It runs on **your** machine against
**your** repos (the AI never runs on the server).

**How it works, per message:**
1. You type a prompt in the Wizard. The UI sends it to the server, which **dispatches** it to your
   agent and returns a **job id** immediately (so the browser never holds a minutes-long request).
2. The agent runs \`claude -p <prompt>\` **from the pack directory** (so Claude auto-loads \`CLAUDE.md\`,
   the skills and the MCP tools) with your source repos attached via \`--add-dir\`, under the chosen
   **model** and **permission mode**.
3. Claude works — reading the catalog, scaffolding, running suites, reading reports (via the MCP
   tools), and editing test files (in your repos) — then returns a JSON result.
4. The UI **polls** the job until it's done; the reply renders in the chat, with a line under it showing
   **cost, duration, turns, tokens, model**.

**Continuity and controls.** Each reply carries a \`session_id\`; the next message uses \`--resume\`, so the
Wizard **remembers the whole conversation**. You can change the **model** and **permission mode** live in
the footer, **Stop** a long run, or start a fresh chat / switch agent. If the agent drops or Claude
stalls, the Wizard reports it instead of hanging.

### Using Claude Code directly (CLI)

The Wizard is optional — the pack is a normal Claude Code project, so you can also use the **\`claude\`
CLI** in your terminal. After **Connect AI** installed the pack at your chosen path:

\`\`\`
cd <install-path>          # e.g. ~/atf-ai
claude                     # interactive session  (or:  claude -p "...")
\`\`\`

Claude Code auto-loads everything in that folder:
- **\`CLAUDE.md\`** — the atf authoring guide (SDK contract, black-box rule, layout).
- **\`.claude/skills/*\`** — the atf skills.
- **\`.mcp.json\`** — starts the atf **MCP server** (\`atf_mcp.py\`), giving you the \`atf_*\` tools.
- **\`.claude/settings.json\`** — pre-approves those tools + file edits.
- **\`.atf-ai.env\`** — \`ATF_SERVER\` / \`ATF_TOKEN\` / \`ATF_AID\` / \`ATF_SOURCES\`; the MCP server reads it
  automatically. To use the same config in the CLI's own shell tools, \`source .atf-ai.env\` first.

This is the **same environment** the Wizard uses — e.g. \`cd ~/atf-ai && claude "list the mgmt tests and
draft one for exposed Telnet"\`, editing the files it creates directly in your repos. If the server was
restarted, \`ATF_TOKEN\` may have expired — re-run **Connect AI** to refresh it.`;

let TP={benches:[], suiteModel:{}, slugOf:{}};
async function editTestPlan(name){
  const isNew=!name;
  const [tp,suites,benches,bmods]=await Promise.all([
    isNew?Promise.resolve({suite:"",bench:"",board:"",mgmt_backend:"docker"}):j("/api/test-plans/"+encodeURIComponent(name)),
    j("/api/suites"), j("/api/benches"), j("/api/board-models")]);

  const sm=await Promise.all(suites.map(s=>j("/api/suites/"+encodeURIComponent(s.name)).then(d=>[s.name,(d.select||{}).model||""]).catch(()=>[s.name,""])));
  TP={benches, suiteModel:Object.fromEntries(sm), slugOf:Object.fromEntries((bmods||[]).map(b=>[b.name,b.slug||b.name]))};
  const boards=tp.bench?(await j("/api/benches/"+encodeURIComponent(tp.bench))).boards.map(b=>b.name):[];
  const opt=(list,sel,ph)=>`<option value="">${ph}</option>`+list.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join("");
  let body=`<div class="panel">`;

  body+=`<div class="grid2"><div class="field"><label>Suite ${hlp("The test/requirement selection to run (Studio › Suites). A suite targets a board-model — only benches with a board of that model are offered below.")}</label><select class="f" id="tp-suite" onchange="tpSuiteChanged()">${opt(suites.map(s=>s.name),tp.suite,"select suite…")}</select><span id="tp-model" class="muted" style="font-size:11px"></span></div>`
    +`<div class="field"><label>MGMT backend ${hlp("docker = run mgmt tests in the atf-mgmt container; local = on the host.")}</label><select class="f" id="tp-backend"><option ${tp.mgmt_backend==='docker'?'selected':''}>docker</option><option ${tp.mgmt_backend==='local'?'selected':''}>local</option></select></div></div>`;
  body+=`<div class="grid2"><div class="field"><label>Bench ${hlp("The inventory where the board lives (Studio › Benches). Filtered to benches that have a board of the suite's model.")}</label><select class="f" id="tp-bench" onchange="tpLoadBoards(this.value)">${opt(benches.map(b=>b.name),tp.bench,"select bench…")}</select></div>`
    +`<div class="field"><label>Board</label><select class="f" id="tp-board" onchange="tpCheckCaps()">${opt(boards,tp.board,"select board…")}</select></div></div>`;
  body+=`<div id="tp-caps" style="margin-top:4px"></div>`;
  body+=`<div class="form-actions"><button class="act" onclick="saveTestPlan(${isNew?'null':`'${esc(name)}'`})">Save</button>`;
  if(!isNew) body+=`<button class="btn-danger" onclick="delTestPlan('${esc(name)}')">Delete</button>`;
  body+=`<span id="cfg-msg" class="muted"></span></div></div>`;
  editorPage(isNew?"New test plan":"Test plan · "+name, body, "tp-plans");
  tpSuiteChanged();
  tpCheckCaps();
}
// filter the bench dropdown to benches whose supported models include the suite's target model
function tpSuiteChanged(){
  const suite=($("#tp-suite")&&$("#tp-suite").value)||"";
  const model=TP.suiteModel[suite]||"";
  const hint=$("#tp-model"); if(hint) hint.textContent=suite?(model?("targets model "+model):"targets any model"):"";
  const bsel=$("#tp-bench"); if(!bsel) return;
  const cur=bsel.value;
  const ok=b=>!model || (b.models||[]).includes(model);
  const compat=TP.benches.filter(ok);
  bsel.innerHTML=`<option value="">select bench…</option>`+compat.map(b=>`<option ${b.name===cur?'selected':''}>${esc(b.name)}</option>`).join("")
    +(TP.benches.filter(b=>!ok(b)).length?`<optgroup label="— incompatible with model ${esc(model)} —">`+TP.benches.filter(b=>!ok(b)).map(b=>`<option disabled>${esc(b.name)} (${(b.models||[]).join(",")||"no model"})</option>`).join("")+`</optgroup>`:"");
  if(cur && !compat.some(b=>b.name===cur)){ bsel.value=""; tpLoadBoards(""); }   // dropped an incompatible pick
}
async function tpLoadBoards(bench){ const sel=$("#tp-board"); if(!sel)return;
  const suite=($("#tp-suite")&&$("#tp-suite").value)||""; const model=TP.suiteModel[suite]||"";
  let boards=[];
  if(bench){ const bd=(await j("/api/benches/"+encodeURIComponent(bench))).boards||[];
    boards=bd.filter(b=>!model || modelSlug(b.model)===model).map(b=>b.name); }
  sel.innerHTML=`<option value="">select board…</option>`+boards.map(b=>`<option>${esc(b)}</option>`).join("");
  tpCheckCaps(); }
// validate the target board provides the drivers/actions the plan's enabled tests need
async function tpCheckCaps(){
  const box=$("#tp-caps"); if(!box) return;
  const suite=$("#tp-suite")?.value, bench=$("#tp-bench")?.value, board=$("#tp-board")?.value;
  if(!suite||!bench||!board){ box.innerHTML=""; return; }
  box.innerHTML='<span class="muted">checking board capabilities…</span>';
  try{
    const r=await adminFetch("/api/test-plans/capabilities",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({suite,bench,board})});
    const d=await r.json();
    const md=d.missing_drivers||[], ma=d.missing_actions||[];
    if(md.length||ma.length){
      const miss=[...md.map(x=>`driver <code>${esc(x)}</code>`),...ma.map(x=>`action <code>${esc(x)}</code>`)].join(", ");
      box.innerHTML=`<div class="badge danger" style="display:block;padding:8px 10px">⚠ board <b>${esc(board)}</b> is missing ${miss} — tests needing these will be <b>SKIPPED</b>. Wire them on the board in Studio › Benches.</div>`;
    } else {
      box.innerHTML=`<div class="badge ok" style="display:block;padding:8px 10px">✓ board provides all drivers/actions the plan's tests need (${(d.need_drivers||[]).map(esc).join(", ")||"none"}${(d.need_actions||[]).length?" · "+d.need_actions.map(esc).join(", "):""}).</div>`;
    }
  }catch(e){ box.innerHTML=""; }
}
// board.model is a display name; the suite model is a slug — use the configured board_model mapping,
// falling back to the same normalization the server uses
function modelSlug(name){ return (TP.slugOf&&TP.slugOf[name]) || (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); }
async function saveTestPlan(name){
  const nm=name||($("#tp-name")?.value||"").trim(); if(!nm){$("#cfg-msg").textContent="name required";return;}
  const d={suite:$("#tp-suite").value,bench:$("#tp-bench").value,board:$("#tp-board").value,mgmt_backend:$("#tp-backend").value};
  const r=await adminFetch("/api/test-plans/"+encodeURIComponent(nm),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
  const j2=await r.json().catch(()=>({})); $("#cfg-msg").textContent=r.ok?"saved ✓":("error: "+(j2.detail||r.status));
  if(r.ok) render("tp-plans");
}
async function delTestPlan(name){ if(!confirm("Delete test plan "+name+"?"))return; await adminFetch("/api/test-plans/"+encodeURIComponent(name),{method:"DELETE"}); render("tp-plans"); }
async function runTestPlan(name){
  const tp=await j("/api/test-plans/"+encodeURIComponent(name));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==="run"));
  await renderRun($("#main"));
  startRunParams({suite:tp.suite,bench:tp.bench,board:[tp.board],mgmt_backend:tp.mgmt_backend});
}

// ---------------- Run / pilot ----------------
let ES=null;
async function renderRun(m){
  const [meta,plans,benches]=await Promise.all([j("/api/meta"),j("/api/test-plans"),j("/api/benches")]);
  const planOpts=plans.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} — ${esc(p.suite)} @ ${esc(p.bench)}/${esc(p.board)}</option>`).join("");
  const suiteOpts=meta.suites.map(s=>`<option>${esc(s)}</option>`).join("");
  const benchOpts=benches.map(b=>`<option>${esc(b.name)}</option>`).join("");
  // tests come from the server REGISTRY AND connected agents (in dev the server has no repos, so
  // the agent supplies every check) — merge + de-dupe so the ad-hoc picker is never empty
  const _ov=await fetchAgentCatalog();
  const _seen=new Set(); const allChecks=[...meta.checks, ...(_ov.agents||[]).flatMap(a=>(a.checks||[]).map(c=>({...c,_origin:"agent:"+(a.name||"")})))]
    .filter(c=>{ if(_seen.has(c.id))return false; _seen.add(c.id); return true; })
    .sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  const checkRows=allChecks.map(c=>`<tr><td style="width:36px;text-align:center"><input type="checkbox" value="${esc(c.id)}"></td>`
    +`<td class="req">${esc(c.id)}</td><td>${capPills(c)}</td>`
    +`<td>${c.disruptive?'<span class="badge danger">disruptive</span> ':''}${c.mode==="manual"?'<span class="badge muted">manual</span>':''}${c._origin?` <span class="pill origin-ag" style="font-size:10px">${esc(c._origin)}</span>`:''}</td></tr>`).join("");
  const checks=(allChecks.length?`<table><thead><tr><th style="width:36px"></th><th>Test</th><th>Drivers · actions</th><th>Flags</th></tr></thead><tbody>${checkRows}</tbody></table>`
    :'<div class="muted" style="padding:12px">no tests available — connect an agent (Studio › Agents) or configure a repo (Admin › Repositories)</div>');
  m.innerHTML=`<div class="panel"><div class="sec-title">Run a saved Test Plan</div>
    <div class="row"><select class="f" id="r-plan" style="min-width:340px">${planOpts||'<option value="">no test plans yet</option>'}</select>
      <button class="act" onclick="runSelectedPlan()">▶ Run plan</button> <a onclick="render('tp-plans')" class="muted">manage plans</a></div></div>
    <div class="panel"><div class="sec-title">Or run ad-hoc</div>
      <div class="grid3"><div class="field"><label>Bench</label><select class="f" id="r-bench" onchange="runLoadBoards(this.value)">${benchOpts}</select></div>
        <div class="field"><label>Board</label><select class="f" id="r-board"></select></div>
        <div class="field"><label>MGMT backend</label><select class="f" id="r-backend"><option>docker</option><option>local</option></select></div></div>
      <div class="grid2"><div class="field"><label><input type="radio" name="mode" id="mode-suite" value="suite" checked> Suite</label><select class="f" id="r-suite" onfocus="$('#mode-suite').checked=true" onchange="$('#mode-suite').checked=true">${suiteOpts}</select></div>
        <div class="field" style="margin:0"><label><input type="radio" name="mode" id="mode-ids" value="ids"> Specific tests</label><div id="r-checks" onchange="$('#mode-ids').checked=true" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)">${checks}</div></div></div>
      <div class="form-actions"><button class="act" onclick="runAdhoc()">▶ Run</button><span class="muted">Disruptive tests run only if ticked.</span></div></div>
    <div class="panel"><div class="sec-title">Live log</div>
      <div id="r-status-bar" class="row" style="display:none;justify-content:space-between;align-items:center;margin:0 0 10px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--raised)">
        <div><span id="r-status" class="badge">idle</span> <span id="r-status-detail" class="muted"></span></div>
        <button id="r-cancel" class="btn-danger" style="display:none" onclick="cancelRun()">■ Cancel run</button></div>
      <div id="r-manual"></div><pre id="r-log" style="max-height:340px">idle.</pre></div>`;
  runLoadBoards(benches[0]?.name||"");
  adminFetch("/api/run/status").then(r=>r.json()).then(s=>{ if(s.active){ log("a run is active — attaching…"); attachStream(); if(s.waiting_on) adminFetch("/api/run/state").then(r=>r.json()).then(x=>{if(x.pending)showManual(x.pending);}); }});
}
let RUN_POLL=null;
function updateRunBar(s){
  const bar=$("#r-status-bar"),st=$("#r-status"),det=$("#r-status-detail"),cx=$("#r-cancel"); if(!bar)return;
  if(s&&s.active){ bar.style.display="flex"; cx.style.display="inline-block";
    st.style.background="var(--acc)"; st.style.color="#fff"; st.textContent=s.cancelling?"cancelling…":"running";
    const wait=s.waiting_on?` · ⏸ waiting on manual check <b>${esc(s.waiting_on.check)}</b>`:"";
    det.innerHTML=`${esc(s.who||"")}${(s.plan&&s.plan.length)?` · ${s.plan.length} check(s)`:""}${wait}`;
  } else { cx.style.display="none"; }
}
async function pollRunStatus(){
  try{ const s=await adminFetch("/api/run/status").then(r=>r.json()); updateRunBar(s);
    if(!s.active&&RUN_POLL){ clearInterval(RUN_POLL); RUN_POLL=null; } }catch(e){}
}
function startRunPoll(){ if(RUN_POLL)clearInterval(RUN_POLL); RUN_POLL=setInterval(pollRunStatus,2000); pollRunStatus(); }
async function cancelRun(){ if(!confirm("Cancel the active run? It stops after the current check."))return;
  const cx=$("#r-cancel"); if(cx){cx.disabled=true;cx.textContent="cancelling…";}
  await adminFetch("/api/run/cancel",{method:"POST"}); log("⏹ cancel requested — the run will stop shortly"); }
async function runLoadBoards(bench){ const sel=$("#r-board"); if(!sel)return;
  const boards=bench?(await j("/api/benches/"+encodeURIComponent(bench))).boards.map(b=>b.name):[];
  sel.innerHTML=boards.map(b=>`<option>${esc(b)}</option>`).join(""); }
async function runSelectedPlan(){ const n=$("#r-plan").value; if(!n){ log("no test plan selected"); return; }
  const tp=await j("/api/test-plans/"+encodeURIComponent(n)); startRunParams({suite:tp.suite,bench:tp.bench,board:[tp.board],mgmt_backend:tp.mgmt_backend}); }
function runAdhoc(){
  const mode=document.querySelector('input[name=mode]:checked').value;
  const p={bench:$("#r-bench").value,board:[$("#r-board").value],mgmt_backend:$("#r-backend").value};
  if(mode==="suite") p.suite=$("#r-suite").value;
  else { p.ids=[...document.querySelectorAll("#r-checks input:checked")].map(c=>c.value); if(!p.ids.length){ log("pick at least one test"); return; } }
  startRunParams(p);
}
function log(line){ const p=$("#r-log"); if(p){ if(p.textContent==="idle.")p.textContent=""; p.textContent+=line+"\n"; p.scrollTop=p.scrollHeight; } }
async function startRunParams(params){
  if(!await ensureLoggedIn()){ log("sign in to run — the report will be yours"); return; }   // runs are attributed to you
  $("#r-log").textContent=""; log("submitting run…"); $("#r-manual").innerHTML="";
  const r=await adminFetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(params)});
  const d=await r.json().catch(()=>({})); if(!d.started){ log("could not start: "+(d.error||"")); return; } attachStream();
}
function runBadge(text,bg){ const st=$("#r-status"); if(st){st.textContent=text;st.style.background=bg;st.style.color="#fff";} const cx=$("#r-cancel"); if(cx){cx.style.display="none";} const bar=$("#r-status-bar"); if(bar)bar.style.display="flex"; }
function attachStream(){
  if(ES) ES.close();
  startRunPoll();
  ES=new EventSource("/api/run/stream");
  ES.onmessage=e=>{ const ev=JSON.parse(e.data);
    if(ev.type==="start") log("▶ start "+JSON.stringify(ev.params));
    else if(ev.type==="plan") log("plan: "+ev.checks.join(", "));
    else if(ev.type==="record") log(`  ${ev.verdict.toUpperCase().padEnd(7)} ${ev.check}  [${(ev.drivers||[]).join(",")||"host"}${(ev.actions||[]).length?" +"+ev.actions.join(","):""}] ${ev.title||""}`);
    else if(ev.type==="manual") showManual(ev);
    else if(ev.type==="manual-done"){ $("#r-manual").innerHTML=""; log(`  (manual ${ev.check} → ${ev.verdict})`); }
    else if(ev.type==="cancelling") log("⏹ cancelling…");
    else if(ev.type==="done"){ log("✔ done "+JSON.stringify(ev.counts||{})+(ev.note?" · "+ev.note:"")); $("#r-manual").innerHTML=""; runBadge("done","var(--pass)"); ES.close(); }
    else if(ev.type==="error"){ log("💥 error: "+ev.message); runBadge("error","var(--gap)"); ES.close(); }
  };
  ES.onerror=()=>{ if(ES) ES.close(); };
}
function showManual(ev){
  $("#r-manual").innerHTML=`<div class="panel" style="border-color:var(--man)">
    <strong>Manual test — ${esc(ev.check||"")}</strong>
    <div class="md" style="max-height:44vh;overflow:auto;margin:6px 0 10px">${md(ev.instructions||"")}</div>
    <textarea id="m-obs" rows="3" style="width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px" placeholder="Observation — what did you see?"></textarea>
    <div style="margin-top:8px">
      <button onclick="answerManual('pass')" style="background:var(--pass)">pass</button>
      <button onclick="answerManual('gap')" style="background:var(--gap)">gap</button>
      <button onclick="answerManual('skip')">skip (pending)</button>
    </div></div>`;
  document.querySelectorAll("#r-manual button").forEach(b=>{b.style.color="#fff";b.style.border="none";b.style.borderRadius="6px";b.style.padding="6px 16px";b.style.marginRight="8px";b.style.cursor="pointer";});
}
async function answerManual(verdict){
  const obs=($("#m-obs")||{}).value||"";
  await adminFetch("/api/manual",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({observation:obs,verdict})});
  $("#r-manual").innerHTML='<span class="muted">answer submitted…</span>';
}

function openDrill(html){ $("#drillbody").innerHTML=html; $("#drill").classList.add("open"); }
function closeDrill(){ $("#drill").classList.remove("open"); }
function openModal(html){ $("#modalbody").innerHTML=html; $("#modal").classList.add("open"); }
function closeModal(){ $("#modal").classList.remove("open"); }
// full-page editor in the SPA (main), with a Back button to a tab
function editorPage(title, body, backTab, extra){
  $("#main").innerHTML=`<div class="editor-head"><button class="btn-ghost" onclick="render('${backTab}')">← Back</button>`
    +`<h2>${esc(title)}</h2><span class="spacer"></span>${extra||""}</div>`+body;
}

function setTheme(t){ document.documentElement.dataset.theme=t; try{localStorage.setItem("atf-theme",t)}catch(e){} }
function initTheme(){
  let t="dark"; try{ t=localStorage.getItem("atf-theme")||"dark"; }catch(e){}
  setTheme(t);
  $("#themebtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
}
async function boot(){
  if(!await loginOk()){ showLogin(); return; }               // the whole app requires login
  const ov=document.getElementById("login-screen"); if(ov) ov.remove();
  const app=document.querySelector(".app"); if(app) app.style.display="";
  const _su=document.getElementById("side-user"); if(_su) _su.innerHTML=ADMIN_USER?("signed in · <strong>"+esc(ADMIN_USER)+"</strong>"):"";
  loadVersion();
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>render(b.dataset.t));
  render("reports");
}
async function loadVersion(){
  const el=document.getElementById("fw-ver"); if(!el) return;
  try{
    const v=await (await fetch("/api/version")).json();
    if(!v.commit){ el.textContent=""; return; }
    el.innerHTML=`⎇ <code>${esc(v.commit)}</code>${v.dirty?' <span class="badge danger" style="padding:0 5px">dirty</span>':''}`;
    el.title=`framework version — commit ${v.commit}${v.ref?" ("+v.ref+")":""}${v.dirty?", uncommitted changes":""}`;
  }catch(e){ el.textContent=""; }
}
function showLogin(){
  const app=document.querySelector(".app"); if(app) app.style.display="none";
  if(document.getElementById("login-screen")) return;         // already up
  const ov=document.createElement("div"); ov.id="login-screen";
  ov.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50";
  ov.innerHTML=`<div class="panel" style="width:340px">
    <div class="brand" style="margin-bottom:16px;justify-content:center"><div style="text-align:center"><div class="brand-t" style="font-size:22px">Anytest</div><div class="brand-s" style="font-size:22px">Framework</div></div></div>
    <div class="field"><label>User</label><input class="f" id="li-user"></div>
    <div class="field"><label>Password</label><input class="f" id="li-pass" type="password" onkeydown="if(event.key==='Enter')document.getElementById('li-go').click()"></div>
    <div class="form-actions" style="border:none;padding-top:4px"><button class="act" id="li-go" style="width:100%">Sign in</button></div>
    <span id="li-msg" class="muted"></span></div>`;
  document.body.appendChild(ov);
  document.getElementById("li-go").onclick=async()=>{
    const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:document.getElementById("li-user").value,password:document.getElementById("li-pass").value})});
    if(r.ok){ const d=await r.json(); setAdminToken(d.token); ADMIN_USER=d.user||""; ADMIN_IS=!!d.is_admin; ov.remove(); boot(); }
    else document.getElementById("li-msg").textContent="invalid credentials";
  };
  const pw=document.getElementById("li-pass"); if(pw) pw.focus();
}
initTheme();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrill();closeModal();}});
boot();
</script>
